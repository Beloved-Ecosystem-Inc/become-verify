# Tests on every pull request and on main: the command-line tool's tests (including the real ethanol sample proofs),
# the browser build: rebuilt from source, compared byte for byte with wasm/SHA256SUMS, then run in Node;
# and the Coq question files with the ethanol sample's data layer (question/check.sh).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo test
        run: cargo test --release --locked
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Toolchain and wasm-bindgen-cli 0.2.100
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build (wasm/build.sh)
        run: wasm/build.sh
      - name: Same bytes as wasm/SHA256SUMS (reproducible build)
        run: cd wasm && sha256sum -c SHA256SUMS
      - name: Browser build on the sample proofs (Node)
        run: |
          cargo build --release --locked
          BV_CLI="$PWD/target/release/become-verify" node --test wasm/test/node-test.mjs > wasm-test.log 2>&1 || { grep -E '^not ok|# (pass|fail)' wasm-test.log; exit 1; }
          grep -E '^# (tests|pass|fail)|^ℹ (tests|pass|fail)' wasm-test.log
  question:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Coq 8.18.0 (coqorg/coq:8.18.0, pinned by digest)
        run: |
          img=coqorg/coq@sha256:b0ddec11e839ab96fd514040d6f2a3a1f47b9e2a3999cc5c7f2527d1925f9126
          docker pull -q "$img"
          mkdir -p "$RUNNER_TEMP/bin"
          for t in coqc coqchk; do
            printf '#!/bin/sh\nexec docker run --rm --ulimit stack=-1:-1 -v "$PWD:$PWD" -w "$PWD" %s %s "$@"\n' "$img" "$t" > "$RUNNER_TEMP/bin/$t"
            chmod +x "$RUNNER_TEMP/bin/$t"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Question and ethanol data layer (question/check.sh)
        run: |
          umask 000
          question/check.sh tests/fixtures/ethanol-sample/pcq702_6-31g_cas8e8o.fcidump ETH | tee check.log
          grep -qx 'OK 14199aece64925c7b73f7e65e42448d7a288ef6f837939a0ed4d159b58000cfe' check.log
