[package]
name = "become-verify"
version = "0.2.0"
edition = "2021"
description = "Verify-only checker for BECOME certified ground-state energy proofs (SP1 6.8.1 Groth16, main_xc)"
license = "Apache-2.0"
publish = false

# Pure-Rust Groth16 verifier only; no prover, no network.
[dependencies]
# Groth16 only: the compressed-proof verifier (the default "full" feature) is not needed, which also lets the same
# code build for WebAssembly (wasm/).
sp1-verifier = { version = "=6.8.1", default-features = false }
sha2 = "=0.10.9"

[lib]
name = "become_verify"
path = "src/lib.rs"

[[bin]]
name = "become-verify"
path = "src/main.rs"
